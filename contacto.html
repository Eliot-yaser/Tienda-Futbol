<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Rey Del Balon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html">⚽ <span>Rey Del Balon</span></a>
        </div>

        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>

        <div class="cart-status" id="header-user-status">
            <a href="carrito.html">
                🛒 Carrito (<span id="cart-count">0</span>)
            </a>

            <a href="login.html" class="btn-login">
                Iniciar Sesión
            </a>
        </div>
    </header>


    <main class="container contact-container">

        <h2>Formulario de Contacto</h2>

        <form
            id="form-contacto"
            class="auth-card-page contact-form"
            novalidate
        >

            <!-- Nombre -->
            <div class="form-group">
                <label for="contact-nombre">
                    Nombre Completo *
                </label>

                <input
                    type="text"
                    id="contact-nombre"
                    maxlength="100"
                    placeholder="Tu Nombre"
                    required
                >

                <span
                    class="error-msg"
                    id="error-contact-nombre">
                </span>
            </div>


            <!-- Correo -->
            <div class="form-group">
                <label for="contact-email">
                    Correo Electrónico *
                </label>

                <input
                    type="email"
                    id="contact-email"
                    maxlength="100"
                    placeholder="ejemplo@duoc.cl"
                    required
                >

                <span
                    class="error-msg"
                    id="error-contact-email">
                </span>
            </div>


            <!-- Teléfono -->
            <div class="form-group">
                <label for="contact-telefono">
                    Teléfono / Celular (Opcional)
                </label>

                <input
                    type="tel"
                    id="contact-telefono"
                    maxlength="15"
                    placeholder="+56 9 1234 5678"
                >

                <span
                    class="error-msg"
                    id="error-contact-telefono">
                </span>
            </div>


            <!-- Comentario -->
            <div class="form-group">
                <label for="contact-comentario">
                    Comentario *
                </label>

                <textarea
                    id="contact-comentario"
                    maxlength="500"
                    rows="5"
                    class="contact-textarea"
                    placeholder="Escribe tu mensaje..."
                    required>
                </textarea>

                <span
                    class="error-msg"
                    id="error-contact-comentario">
                </span>
            </div>


            <button
                type="submit"
                class="btn-auth">
                ENVIAR MENSAJE
            </button>

        </form>

    </main>


    <footer class="footer">
        <p>
            &copy; 2026 Rey Del Balon -
            Todos los derechos reservados.
        </p>
    </footer>


    <!-- Scripts -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/login.js"></script>


    <script>
        document
            .getElementById("form-contacto")
            ?.addEventListener("submit", (e) => {

                e.preventDefault();

                document
                    .querySelectorAll("#form-contacto .error-msg")
                    .forEach(span => {
                        span.textContent = "";
                    });


                const nombre =
                    document
                        .getElementById("contact-nombre")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("contact-email")
                        .value
                        .trim();

                const telefono =
                    document
                        .getElementById("contact-telefono")
                        .value
                        .trim();

                const comentario =
                    document
                        .getElementById("contact-comentario")
                        .value
                        .trim();


                let valido = true;


                // Validar Nombre
                if (!nombre) {

                    document
                        .getElementById("error-contact-nombre")
                        .textContent =
                        "El nombre es requerido.";

                    valido = false;

                } else if (nombre.length > 100) {

                    document
                        .getElementById("error-contact-nombre")
                        .textContent =
                        "Máximo 100 caracteres.";

                    valido = false;
                }


                // Validar Correo
                if (!email) {

                    document
                        .getElementById("error-contact-email")
                        .textContent =
                        "El correo es requerido.";

                    valido = false;

                } else if (email.length > 100) {

                    document
                        .getElementById("error-contact-email")
                        .textContent =
                        "Máximo 100 caracteres.";

                    valido = false;

                } else if (
                    typeof validarDominioCorreo === "function" &&
                    !validarDominioCorreo(email)
                ) {

                    document
                        .getElementById("error-contact-email")
                        .textContent =
                        "Solo correos @duoc.cl, @profesor.duoc.cl y @gmail.com";

                    valido = false;
                }


                // Validar Teléfono
                if (telefono !== "") {

                    const regexTelefono =
                        /^[+]?[0-9\s-]{8,15}$/;

                    if (!regexTelefono.test(telefono)) {

                        document
                            .getElementById("error-contact-telefono")
                            .textContent =
                            "Ingresa un número de teléfono válido (ej: +56912345678).";

                        valido = false;
                    }
                }


                // Validar Comentario
                if (!comentario) {

                    document
                        .getElementById("error-contact-comentario")
                        .textContent =
                        "El comentario es requerido.";

                    valido = false;

                } else if (comentario.length > 500) {

                    document
                        .getElementById("error-contact-comentario")
                        .textContent =
                        "Máximo 500 caracteres.";

                    valido = false;
                }


                // Si todo está correcto
                if (valido) {

                    if (
                        typeof mostrarNotificacionToast === "function"
                    ) {

                        mostrarNotificacionToast(
                            "¡Mensaje de contacto enviado con éxito!"
                        );

                    } else {

                        alert(
                            "¡Mensaje enviado con éxito!"
                        );
                    }


                    document
                        .getElementById("form-contacto")
                        .reset();
                }

            });
    </script>

</body>
</html>
