<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Rey Del Balon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Encabezado / Navegación -->
    <header class="header">
        <div class="logo">
            <a href="index.html">⚽ <span>Rey Del Balon</span></a>
        </div>

        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="cart-status" id="header-user-status">
            <a href="carrito.html">
                🛒 Carrito (<span id="cart-count">0</span>)
            </a>

            <a href="login.html" class="btn-login active">
                Iniciar Sesión
            </a>
        </div>
    </header>


    <!-- Contenedor Principal de Login -->
    <main class="main-auth-container">

        <div class="auth-card-page">

            <form id="form-login" class="auth-form active" novalidate>

                <h2>¡Hola de nuevo!</h2>

                <p class="auth-subtitle">
                    Ingresa a tu cuenta para continuar tus compras.
                </p>


                <!-- Correo -->
                <div class="form-group">
                    <label for="login-email">
                        Correo Electrónico *
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        maxlength="100"
                        placeholder="ejemplo@duoc.cl"
                        required
                    >

                    <span
                        class="error-msg"
                        id="error-login-email">
                    </span>
                </div>


                <!-- Contraseña -->
                <div class="form-group">
                    <label for="login-password">
                        Contraseña *
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        minlength="4"
                        maxlength="10"
                        placeholder="••••••••"
                        required
                    >

                    <span
                        class="error-msg"
                        id="error-login-password">
                    </span>
                </div>


                <button
                    type="submit"
                    class="btn-auth">
                    INGRESAR
                </button>


                <a href="#" class="forgot-pass">
                    ¿Olvidaste tu contraseña?
                </a>


                <p class="auth-subtitle auth-register-link">
                    ¿No tienes una cuenta?
                    <a href="registro.html">
                        Regístrate aquí
                    </a>
                </p>

            </form>

        </div>

    </main>


    <!-- Pie de Página -->
    <footer class="footer">
        <p>
            &copy; 2026 Rey Del Balon -
            Todos los derechos reservados.
        </p>
    </footer>


    <!-- Scripts -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
